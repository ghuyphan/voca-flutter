name: voca_flutter
description: "Voca - YouTube Language Immersion with Interactive Subtitles & SRS"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management (Signal-first reactive state matching Angular 19 Signals)
  signals_flutter: ^5.5.0

  # Networking & HTTP Client
  dio: ^5.7.0

  # Supabase Backend-as-a-Service (Auth, Postgres, RPC)
  supabase_flutter: ^2.8.0

  # Offline Local Storage
  hive_ce: ^2.10.0
  hive_ce_flutter: ^2.2.0

  # YouTube Playback
  youtube_player_flutter: ^10.0.1
  youtube_player_iframe: ^6.0.2

  # Cloudflare Turnstile & Web interactions
  flutter_inappwebview: ^6.1.5

  # Payments & Utilities
  purchases_flutter: ^8.6.0
  url_launcher: ^6.3.1
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  audioplayers: ^6.8.1
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/grammar/grammar_ja.json
    - assets/grammar/grammar_zh.json
    - assets/grammar/grammar_ko.json
    - assets/grammar/grammar_en.json
    - assets/grammar/translations/
    - assets/i18n/
    - assets/images/
    - assets/icons/
    - assets/avatars/
    - assets/flags/
    - assets/illustrations/
